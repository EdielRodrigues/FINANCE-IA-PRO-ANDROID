plugins { id 'com.android.application' }
android {
 namespace 'br.com.financeiapro'
 compileSdk 35
 defaultConfig { applicationId 'br.com.financeiapro'; minSdk 24; targetSdk 35; versionCode 1044; versionName '10.4.4' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs {
  release {
   def store = System.getenv('FINANCE_KEYSTORE_PATH')
   if (store) {
    storeFile file(store)
    storePassword System.getenv('FINANCE_STORE_PASSWORD')
    keyAlias System.getenv('FINANCE_KEY_ALIAS')
    keyPassword System.getenv('FINANCE_KEY_PASSWORD')
   }
  }
 }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
